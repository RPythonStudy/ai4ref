# config/key_questions.yml
# ═══════════════════════════════════════════════════════════════════════════════
# Key Questions — 진료지침 기반 신규문헌 감시 (임상 KQ; 각 KQ 가 PICO·검증 보유)
#
# 핵심 로직: 가이드라인에서 추출한 P·I 검색어를 OR 로 묶어 블록을 만들고,
#            검색식 = (I 블록) AND (P 블록).
#
# 전략 (KQ 마다):
#   1. PICO 추출 — P·I 검색어, C·O 필터 기준
#   2. P·I 를 OR-블록으로 (시드 역공학: 지침 근거문헌의 MeSH/tiab 로 채움)
#   3. 검증 A(guideline_refs)로 정련 — recall 낮으면 블록에 synonym 추가(확장)
#      → 블록이 자라는 게 곧 6/9 → 8/9. (정련 = OR 리스트 항목 추가)
#   4. 런타임: build_query(pico) = (I) AND (P) 로 검색 (넓은 그물, 결정론)
#   5. C·O → 게이트 필터 (스크리닝서 판정, 검색식 제외 — 추론)
#
# 필드:
#   kq                        KQ 주제
#   question_type             intervention | diagnostic | prognostic | predictive
#   pico:
#     P  (OR 리스트)          대상·병태 검색어 — OR 로 묶임 (검색식 P 블록)
#     I  (OR 리스트)          중재/검사 검색어 — OR 로 묶임 (검색식 I 블록)
#     C  (필터 기준)          대조 — 보통 개방. 게이트 참고
#     O  (필터 기준)          결과 — 색인 누락 위험 → 검색식 제외, 게이트서 판정
#   guideline {name,pmid,date=T}   감시 대상 지침 (date = T, 제정 시점)
#   guideline_refs            검증 A: T 이전 지침 근거문헌 (재현해야 = recall)
#   post_guideline_landmarks  검증 B: T 이후 practice-changing 랜드마크 (포착해야)
#   collection                Zotero 컬렉션명 (랜드마크 보관처)
#   enabled                   감시 여부 토글
#
# 검색식은 P·I 리스트에서 build_query 로 파생 (별도 저장 안 함). 정련 = 리스트 항목 추가.
# (구 일반 수집 KQ 는 config/legacy_collections.yml 로 아카이브 — collector 전용·term-based)
# ═══════════════════════════════════════════════════════════════════════════════

kqs:

  - kq: "주요 복부수술 환자에서 수술전후 수액 전략의 효과"
    question_type: intervention
    guideline:
      name: "ERAS 2012 elective colonic surgery — 수술전후 수액 관리 권고"
      pmid: "23099039"        # Gustafsson 2012, Clin Nutr
      date: "2012-12"         # T (제정 시점)
    collection: eras-fluid-abdominal
    enabled: true
    created_date: "2026-06-20"
